<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="352" viewBox="0 0 1440 352" role="img" aria-labelledby="title desc">
  <title id="title">DxpBGC — from protein evidence to candidate gene clusters</title>
  <desc id="desc">A navy and teal project banner with a schematic genomic neighborhood. Gene arrows are decorative, not experimental data.</desc>
