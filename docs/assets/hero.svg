    <text x="56" y="205" fill="#f2f6fa" font-size="30">From protein evidence</text>
    <text x="56" y="244" fill="#f2f6fa" font-size="30">to candidate gene clusters.</text>
    <text x="56" y="326" fill="#bdd2de" font-size="18" letter-spacing="1.5">GENOME MINING / ANNOTATION / EVIDENCE REVIEW</text>
